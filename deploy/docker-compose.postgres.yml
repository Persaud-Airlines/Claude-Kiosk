# Optional: PostgreSQL 16 in Docker for development / Linux hosts.
#   docker compose -f deploy/docker-compose.postgres.yml up -d
#   backend/.env -> USE_SQLITE=false, DATABASE_URL=postgresql+asyncpg://detechtive:detechtive@localhost:5432/detechtive
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: detechtive
      POSTGRES_PASSWORD: detechtive   # change for anything but local development
      POSTGRES_DB: detechtive
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detechtive"]
      interval: 5s
volumes:
  pgdata:
