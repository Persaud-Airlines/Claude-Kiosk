; DE-TECH-TIVE TECHNOLOGIES Inc — Classroom Kiosk firmware
; Target: Waveshare ESP32-S3-Touch-LCD-7 (ESP32-S3-WROOM-1-N8R8, 800x480 RGB, GT911, CH422G)
; Framework: ESP-IDF 5.3 (via PlatformIO). LVGL / UVC / JPEG come from the ESP Component Registry
; (see main/idf_component.yml) and are fetched automatically on first build.

[platformio]
default_envs = kiosk
src_dir = main

[env]
platform = espressif32@6.9.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.embed_files =
    main/assets/mock_card.jpg
board_build.embed_txtfiles =
    main/certs/host_ca.pem
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Production kiosk: USB UVC webcam on the OTG port
[env:kiosk]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; Bench testing without a webcam: frames are injected from main/assets/mock_card.jpg
[env:kiosk-mock-camera]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.mockcam"

; Hardened production build: flash encryption (release) + encrypted NVS + secure boot v2.
; READ docs/FIRMWARE.md FIRST — this permanently burns eFuses on the device.
[env:kiosk-secure]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.prod"
